<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResearchAI Extension Preview</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Mocking Lucide React components using standard HTML/SVG for the CDN environment
    const Icon = ({ name, size = 24, className = "" }) => {
      const iconRef = React.useRef(null);
      useEffect(() => {
        if (iconRef.current) {
          lucide.createIcons({
            icons: { [name]: true },
            nameAttr: 'data-lucide',
            root: iconRef.current.parentElement
          });
        }
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={className} ref={iconRef}></i>;
    };

    function App() {
      const [isNotesOpen, setIsNotesOpen] = useState(false);
      const [isSourcesOpen, setIsSourcesOpen] = useState(false);
      
      const [notes, setNotes] = useState([
        { id: 1, title: 'Research Ideas', content: 'Need to look into Gemma 4 parameters and how they compare to Llama 3.' }
      ]);
      const [activeNote, setActiveNote] = useState(notes[0]);

      const addNewNote = () => {
        const newNote = { id: Date.now(), title: 'New Note', content: '' };
        setNotes([...notes, newNote]);
        setActiveNote(newNote);
      };

      return (
        <div className="flex h-screen bg-[#f8f9fa] overflow-hidden font-sans relative">
          
          {/* --- MOCK GOOGLE DOCS HEADER --- */}
          <div className="absolute top-0 w-full bg-white border-b border-gray-200 z-10 flex flex-col">
            <div className="flex items-center px-4 py-2">
              <div className="w-10 h-10 bg-[#4285F4] rounded text-white flex items-center justify-center font-bold mr-3">
                <Icon name="file-text" size={24} />
              </div>
              <div className="flex flex-col">
                <span className="text-gray-800 text-lg px-1 hover:border-gray-300 border border-transparent rounded cursor-pointer transition-colors w-fit">
                  AI Research Paper
                </span>
                <div className="flex space-x-1 text-sm text-gray-600 mt-0.5">
                  <span className="px-2 py-0.5 hover:bg-gray-100 rounded cursor-pointer">File</span>
                  <span className="px-2 py-0.5 hover:bg-gray-100 rounded cursor-pointer">Edit</span>
                  <span className="px-2 py-0.5 hover:bg-gray-100 rounded cursor-pointer">View</span>
                  <span className="px-2 py-0.5 hover:bg-gray-100 rounded cursor-pointer">Insert</span>
                  <span className="px-2 py-0.5 hover:bg-gray-100 rounded cursor-pointer">Format</span>
                  <span className="px-2 py-0.5 hover:bg-gray-100 rounded cursor-pointer">Tools</span>
                  <span className="px-2 py-0.5 bg-blue-50 text-blue-700 font-medium rounded cursor-pointer">Extensions</span>
                </div>
              </div>
            </div>
            
            {/* Mock Docs Toolbar */}
            <div className="h-10 border-t border-gray-200 flex items-center px-4 space-x-4 text-gray-600 text-sm bg-gray-50 rounded-full mx-4 mb-2 shadow-sm">
              <span className="font-bold hover:bg-gray-200 px-2 rounded cursor-pointer">B</span>
              <span className="italic hover:bg-gray-200 px-2 rounded cursor-pointer">I</span>
              <span className="underline hover:bg-gray-200 px-2 rounded cursor-pointer">U</span>
              <div className="w-px h-4 bg-gray-300"></div>
              <span className="hover:bg-gray-200 px-2 rounded cursor-pointer">Normal text</span>
              <div className="w-px h-4 bg-gray-300"></div>
              <span className="hover:bg-gray-200 px-2 rounded cursor-pointer">Arial</span>
              <div className="w-px h-4 bg-gray-300"></div>
              <span className="hover:bg-gray-200 px-2 rounded cursor-pointer">11</span>
            </div>
          </div>

          {/* --- EXTENSION: LEFT TAB (NOTES) --- */}
          {!isNotesOpen && (
            <button 
              onClick={() => setIsNotesOpen(true)}
              className="absolute left-0 top-1/2 -translate-y-1/2 bg-white shadow-lg border border-gray-200 rounded-r-lg p-2 flex items-center gap-2 hover:bg-blue-50 hover:text-blue-600 transition-colors z-20"
            >
              <Icon name="chevron-right" size={16} />
              <span className="font-medium text-sm py-2" style={{writingMode: 'vertical-rl', transform: 'rotate(180deg)'}}>
                Notes
              </span>
            </button>
          )}

          {/* --- EXTENSION: LEFT SIDEBAR (NOTES) --- */}
          <div className={`absolute left-0 top-[120px] bottom-4 w-80 bg-white shadow-2xl rounded-tr-xl rounded-br-xl transition-transform duration-300 z-30 border border-gray-200 flex flex-col ${isNotesOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-blue-600 text-white rounded-tr-xl">
              <h2 className="font-bold text-lg flex items-center gap-2"><Icon name="file-text" size={18}/> Notes</h2>
              <button onClick={() => setIsNotesOpen(false)} className="text-blue-100 hover:text-white transition-colors">
                <Icon name="x" size={20} />
              </button>
            </div>
            <div className="p-4 flex-grow overflow-y-auto">
              <button onClick={addNewNote} className="w-full mb-4 py-2 border border-blue-500 text-blue-600 rounded-lg hover:bg-blue-50 flex items-center justify-center gap-2 font-medium transition-colors">
                <Icon name="plus" size={16} /> New Note
              </button>
              <div className="space-y-3">
                {notes.map(note => (
                  <div 
                    key={note.id} 
                    className={`p-3 border rounded-lg cursor-pointer transition-all ${activeNote?.id === note.id ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-gray-200 hover:bg-gray-50'}`} 
                    onClick={() => setActiveNote(note)}
                  >
                    <div className="font-semibold text-sm mb-1 text-gray-800">{note.title}</div>
                    <div className="text-xs text-gray-500 truncate">{note.content || 'Empty note...'}</div>
                  </div>
                ))}
              </div>
            </div>
            
            {/* Active Note Editor */}
            {activeNote && (
              <div className="h-[40%] border-t border-gray-200 p-4 bg-yellow-50/50 flex flex-col rounded-br-xl">
                <input 
                  className="font-bold bg-transparent border-none outline-none mb-2 text-gray-800 placeholder-gray-400" 
                  value={activeNote.title} 
                  placeholder="Note Title"
                  onChange={(e) => {
                    const updated = {...activeNote, title: e.target.value};
                    setActiveNote(updated);
                    setNotes(notes.map(n => n.id === updated.id ? updated : n));
                  }}
                />
                <textarea 
                  className="w-full flex-grow bg-transparent border-none outline-none resize-none text-sm text-gray-700 placeholder-gray-400" 
                  placeholder="Type your notes here..."
                  value={activeNote.content}
                  onChange={(e) => {
                    const updated = {...activeNote, content: e.target.value};
                    setActiveNote(updated);
                    setNotes(notes.map(n => n.id === updated.id ? updated : n));
                  }}
                />
              </div>
            )}
          </div>

          {/* --- GOOGLE DOCS CANVAS --- */}
          <div className="flex-grow pt-36 pb-8 overflow-y-auto flex justify-center w-full z-0 px-12">
            <div 
              className="w-[816px] min-h-[1056px] bg-white shadow-md border border-gray-300 p-[96px] outline-none mb-12" 
              contentEditable 
              suppressContentEditableWarning={true}
            >
              <h1 className="text-3xl font-bold mb-6 text-center text-gray-900">AI Research Paper</h1>
              
              <h2 className="text-xl font-bold mb-2 mt-8 text-gray-800">Abstract</h2>
              <p className="mb-4 text-gray-700 leading-relaxed">
                Begin typing your research abstract here. You can edit this directly like a normal document.
              </p>
              
              <h2 className="text-xl font-bold mb-2 mt-8 text-gray-800">1. Introduction</h2>
              <p className="mb-4 text-gray-700 leading-relaxed">
                Start the introduction to your open source / open weight AI research here...
              </p>
            </div>
          </div>

          {/* --- EXTENSION: RIGHT TAB (SUGGESTED SOURCES) --- */}
          {!isSourcesOpen && (
            <button 
              onClick={() => setIsSourcesOpen(true)}
              className="absolute right-0 top-1/2 -translate-y-1/2 bg-white shadow-lg border border-gray-200 rounded-l-lg p-2 flex items-center gap-2 hover:bg-green-50 hover:text-green-700 transition-colors z-20"
            >
              <span className="font-medium text-sm py-2" style={{writingMode: 'vertical-rl'}}>
                Suggested Sources
              </span>
              <Icon name="chevron-left" size={16} />
            </button>
          )}

          {/* --- EXTENSION: RIGHT SIDEBAR (SUGGESTED SOURCES) --- */}
          <div className={`absolute right-0 top-[120px] bottom-4 w-80 bg-white shadow-2xl rounded-tl-xl rounded-bl-xl transition-transform duration-300 z-30 border border-gray-200 flex flex-col ${isSourcesOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-green-700 text-white rounded-tl-xl">
              <h2 className="font-bold text-lg flex items-center gap-2"><Icon name="book-open" size={18}/> Suggested Sources</h2>
              <button onClick={() => setIsSourcesOpen(false)} className="text-green-100 hover:text-white transition-colors">
                <Icon name="x" size={20} />
              </button>
            </div>
            
            <div className="p-3 border-b border-gray-100 bg-gray-50">
              <div className="relative">
                <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                <input 
                  type="text" 
                  placeholder="Search similar papers..." 
                  className="w-full pl-9 pr-3 py-2 bg-white border border-gray-300 rounded-lg text-sm outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500"
                />
              </div>
            </div>

            <div className="p-4 overflow-y-auto space-y-4 flex-grow bg-gray-50/50">
              
              <div className="p-3 border border-gray-200 rounded-lg hover:shadow-md transition-all cursor-pointer bg-white group">
                <h4 className="font-semibold text-sm text-green-700 leading-tight mb-1 group-hover:underline">
                  Gemma: Open Models Based on Gemini Research
                </h4>
                <p className="text-xs text-gray-500 mb-2">Google DeepMind (2024)</p>
                <p className="text-xs text-gray-700 line-clamp-3 mb-3">
                  This work introduces Gemma, a family of lightweight, state-of-the-art open models built from the same research...
                </p>
                <div className="flex gap-2">
                  <button className="px-3 py-1.5 bg-green-50 text-green-700 font-medium rounded-md text-xs hover:bg-green-100 w-full transition-colors">
                    Cite Source
                  </button>
                </div>
              </div>

              <div className="p-3 border border-gray-200 rounded-lg hover:shadow-md transition-all cursor-pointer bg-white group">
                <h4 className="font-semibold text-sm text-green-700 leading-tight mb-1 group-hover:underline">
                  Attention Is All You Need
                </h4>
                <p className="text-xs text-gray-500 mb-2">Vaswani et al. (2017)</p>
                <p className="text-xs text-gray-700 line-clamp-3 mb-3">
                  The dominant sequence transduction models are based on complex recurrent or convolutional neural networks...
                </p>
                <div className="flex gap-2">
                  <button className="px-3 py-1.5 bg-green-50 text-green-700 font-medium rounded-md text-xs hover:bg-green-100 w-full transition-colors">
                    Cite Source
                  </button>
                </div>
              </div>

            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
